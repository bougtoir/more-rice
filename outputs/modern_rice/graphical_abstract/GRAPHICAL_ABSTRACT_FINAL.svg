<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1000" viewBox="0 0 2500 1000"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#4A5568"/></marker></defs><rect width="2500" height="1000" fill="#FFFFFF"/><text x="1250" y="52" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#1A202C" text-anchor="middle" font-weight="bold">Rice diversification beyond traditional growing regions:</text><text x="1250" y="96" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#4A5568" text-anchor="middle" font-weight="normal">conditional feasibility requires cultivar, water and failure-pathway co-evaluation</text><rect x="40" y="130" width="740" height="690" rx="14" fill="#F4F6F7" stroke="#4A5568" stroke-width="2.5"/><text x="410.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#1A202C" text-anchor="middle" font-weight="bold">1  Technology changes feasibility</text><rect x="820" y="130" width="740" height="690" rx="14" fill="#F4F6F7" stroke="#4A5568" stroke-width="2.5"/><text x="1190.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#1A202C" text-anchor="middle" font-weight="bold">2  Cultivation system sets water-failure pathways</text><rect x="1600" y="130" width="740" height="690" rx="14" fill="#F4F6F7" stroke="#4A5568" stroke-width="2.5"/><text x="1970.0" y="174" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#1A202C" text-anchor="middle" font-weight="bold">3  Conditional food-supply resilience</text><g transform="translate(130,380) scale(1.1)" stroke="#2B6CB0" fill="none" stroke-width="4"><rect x="-7" y="-60" width="14" height="50" rx="7"/><circle cx="0" cy="-2" r="11" fill="#2B6CB0"/><line x1="0" y1="-14" x2="0" y2="-50" stroke-width="5"/><line x1="8" y1="-45" x2="16" y2="-45"/><line x1="8" y1="-30" x2="16" y2="-30"/></g><text x="130" y="430" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4A5568" text-anchor="middle" font-weight="normal">climate-only</text><text x="130" y="456" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4A5568" text-anchor="middle" font-weight="normal">screen</text><text x="130" y="330" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#C53030" text-anchor="middle" font-weight="bold">✗</text><line x1="210" y1="355" x2="310" y2="355" stroke="#4A5568" stroke-width="5" marker-end="url(#arr)"/><g transform="translate(370,380) scale(1.3)" stroke="#2F855A" fill="#2F855A"><path d="M0,0 C0,-30 6,-52 14,-66" fill="none" stroke-width="4"/><ellipse cx="14" cy="-66" rx="7" ry="16" transform="rotate(-25 14 -66)"/><ellipse cx="10" cy="-56" rx="7" ry="16" transform="rotate(-20 10 -56)"/><ellipse cx="17" cy="-72" rx="7" ry="16" transform="rotate(-32 17 -72)"/></g><text x="385" y="430" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#4A5568" text-anchor="middle" font-weight="normal">+ cultivar, nursery,</text><text x="385" y="454" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#4A5568" text-anchor="middle" font-weight="normal">transplant, warm water</text><line x1="480" y1="355" x2="580" y2="355" stroke="#4A5568" stroke-width="5" marker-end="url(#arr)"/><rect x="600" y="315" width="160" height="60" rx="8" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="3"/><line x1="600" y1="330.0" x2="760" y2="330.0" stroke="#90CDF4" stroke-width="2"/><line x1="600" y1="345.0" x2="760" y2="345.0" stroke="#90CDF4" stroke-width="2"/><line x1="600" y1="360.0" x2="760" y2="360.0" stroke="#90CDF4" stroke-width="2"/><g transform="translate(630,369) scale(0.45)" stroke="#2F855A" fill="#2F855A"><path d="M0,0 C0,-30 6,-52 14,-66" fill="none" stroke-width="4"/><ellipse cx="14" cy="-66" rx="7" ry="16" transform="rotate(-25 14 -66)"/><ellipse cx="10" cy="-56" rx="7" ry="16" transform="rotate(-20 10 -56)"/><ellipse cx="17" cy="-72" rx="7" ry="16" transform="rotate(-32 17 -72)"/></g><g transform="translate(690,369) scale(0.45)" stroke="#2F855A" fill="#2F855A"><path d="M0,0 C0,-30 6,-52 14,-66" fill="none" stroke-width="4"/><ellipse cx="14" cy="-66" rx="7" ry="16" transform="rotate(-25 14 -66)"/><ellipse cx="10" cy="-56" rx="7" ry="16" transform="rotate(-20 10 -56)"/><ellipse cx="17" cy="-72" rx="7" ry="16" transform="rotate(-32 17 -72)"/></g><g transform="translate(750,369) scale(0.45)" stroke="#2F855A" fill="#2F855A"><path d="M0,0 C0,-30 6,-52 14,-66" fill="none" stroke-width="4"/><ellipse cx="14" cy="-66" rx="7" ry="16" transform="rotate(-25 14 -66)"/><ellipse cx="10" cy="-56" rx="7" ry="16" transform="rotate(-20 10 -56)"/><ellipse cx="17" cy="-72" rx="7" ry="16" transform="rotate(-32 17 -72)"/></g><text x="680" y="420" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#2B6CB0" text-anchor="middle" font-weight="bold">Hokkaido</text><text x="680" y="446" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2B6CB0" text-anchor="middle" font-weight="bold">OBSERVED</text><rect x="80" y="490" width="660" height="110" rx="10" fill="#EBF4FA" stroke="#2B6CB0" stroke-width="2"/><text x="410.0" y="532" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#2B6CB0" text-anchor="middle" font-weight="bold">~900 GDD10 (Jun–Sep)</text><text x="410.0" y="562" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4A5568" text-anchor="middle" font-weight="normal">system-specific observed lower bound</text><text x="410.0" y="586" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4A5568" text-anchor="middle" font-weight="normal">not a universal threshold</text><rect x="80" y="630" width="660" height="150" rx="10" fill="#FBF3E4" stroke="#B7791F" stroke-width="2" stroke-dasharray="8,5"/><text x="410.0" y="670" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#B7791F" text-anchor="middle" font-weight="bold">European candidate cells</text><text x="410.0" y="702" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#4A5568" text-anchor="middle" font-weight="normal">(Rhine, Alsace, Loire, Saxony…)</text><text x="410.0" y="732" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#B7791F" text-anchor="middle" font-weight="normal">hypothetical transfer — field</text><text x="410.0" y="758" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#B7791F" text-anchor="middle" font-weight="normal">validation required</text><rect x="860" y="200" width="660" height="168" rx="10" fill="#FFFFFF" stroke="#2C7A7B" stroke-width="2.5"/><rect x="890" y="228" width="150" height="58" rx="8" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="3"/><line x1="890" y1="242.5" x2="1040" y2="242.5" stroke="#90CDF4" stroke-width="2"/><line x1="890" y1="257.0" x2="1040" y2="257.0" stroke="#90CDF4" stroke-width="2"/><line x1="890" y1="271.5" x2="1040" y2="271.5" stroke="#90CDF4" stroke-width="2"/><g transform="translate(920,280) scale(0.45)" stroke="#2F855A" fill="#2F855A"><path d="M0,0 C0,-30 6,-52 14,-66" fill="none" stroke-width="4"/><ellipse cx="14" cy="-66" rx="7" ry="16" transform="rotate(-25 14 -66)"/><ellipse cx="10" cy="-56" rx="7" ry="16" transform="rotate(-20 10 -56)"/><ellipse cx="17" cy="-72" rx="7" ry="16" transform="rotate(-32 17 -72)"/></g><g transform="translate(980,280) scale(0.45)" stroke="#2F855A" fill="#2F855A"><path d="M0,0 C0,-30 6,-52 14,-66" fill="none" stroke-width="4"/><ellipse cx="14" cy="-66" rx="7" ry="16" transform="rotate(-25 14 -66)"/><ellipse cx="10" cy="-56" rx="7" ry="16" transform="rotate(-20 10 -56)"/><ellipse cx="17" cy="-72" rx="7" ry="16" transform="rotate(-32 17 -72)"/></g><g transform="translate(1040,280) scale(0.45)" stroke="#2F855A" fill="#2F855A"><path d="M0,0 C0,-30 6,-52 14,-66" fill="none" stroke-width="4"/><ellipse cx="14" cy="-66" rx="7" ry="16" transform="rotate(-25 14 -66)"/><ellipse cx="10" cy="-56" rx="7" ry="16" transform="rotate(-20 10 -56)"/><ellipse cx="17" cy="-72" rx="7" ry="16" transform="rotate(-32 17 -72)"/></g><text x="1280" y="240" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#2C7A7B" text-anchor="middle" font-weight="bold">Irrigated lowland</text><text x="1280" y="295" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4A5568" text-anchor="middle" font-weight="normal">conditional in Lower Danube —</text><text x="1280" y="322" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4A5568" text-anchor="middle" font-weight="normal">delivery &amp; infrastructure, not discharge</text><rect x="860" y="378" width="660" height="168" rx="10" fill="#FFFFFF" stroke="#C05621" stroke-width="2.5"/><g transform="translate(940,392) scale(0.8)"><path d="M-45,10 a20,20 0 0,1 8,-38 a26,26 0 0,1 48,-6 a18,18 0 0,1 24,24 a14,14 0 0,1 -8,20 z" fill="#CBD5E0" stroke="#718096" stroke-width="3"/></g><line x1="914" y1="406.4" x2="908" y2="422.4" stroke="#2B6CB0" stroke-width="4"/><line x1="934" y1="406.4" x2="928" y2="422.4" stroke="#2B6CB0" stroke-width="4"/><line x1="954" y1="406.4" x2="948" y2="422.4" stroke="#2B6CB0" stroke-width="4"/><line x1="974" y1="406.4" x2="968" y2="422.4" stroke="#2B6CB0" stroke-width="4"/><rect x="880" y="470" width="150" height="58" rx="6" fill="#9C6B30" stroke="#4A5568" stroke-width="2.5"/><rect x="880" y="470" width="150" height="14" rx="6" fill="#68D391" opacity="0.55"/><path d="M910,470 l0,-22 m0,0 l-9,-10 m9,10 l9,-10" stroke="#C05621" stroke-width="4" fill="none"/><path d="M965,470 l0,-22 m0,0 l-9,-10 m9,10 l9,-10" stroke="#C05621" stroke-width="4" fill="none"/><path d="M1020,470 l0,-22 m0,0 l-9,-10 m9,10 l9,-10" stroke="#C05621" stroke-width="4" fill="none"/><text x="1280" y="418" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#C05621" text-anchor="middle" font-weight="bold">Rainfed upland</text><text x="1280" y="473" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4A5568" text-anchor="middle" font-weight="normal">modeled flowering moisture deficit</text><text x="1280" y="500" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4A5568" text-anchor="middle" font-weight="normal">88–100% of yrs (continental EU cells)</text><rect x="860" y="556" width="660" height="168" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="2.5"/><g transform="translate(940,570) scale(0.8)"><path d="M-45,10 a20,20 0 0,1 8,-38 a26,26 0 0,1 48,-6 a18,18 0 0,1 24,24 a14,14 0 0,1 -8,20 z" fill="#CBD5E0" stroke="#718096" stroke-width="3"/></g><line x1="914" y1="584.4" x2="908" y2="600.4" stroke="#2B6CB0" stroke-width="4"/><line x1="934" y1="584.4" x2="928" y2="600.4" stroke="#2B6CB0" stroke-width="4"/><line x1="954" y1="584.4" x2="948" y2="600.4" stroke="#2B6CB0" stroke-width="4"/><line x1="974" y1="584.4" x2="968" y2="600.4" stroke="#2B6CB0" stroke-width="4"/><rect x="880" y="648" width="150" height="58" rx="6" fill="#7B5A2E" stroke="#4A5568" stroke-width="2.5"/><rect x="880" y="648" width="150" height="14" rx="6" fill="#68D391" opacity="0.55"/><path d="M910,648 l0,-22 m0,0 l-9,-10 m9,10 l9,-10" stroke="#2F855A" stroke-width="4" fill="none"/><path d="M965,648 l0,-22 m0,0 l-9,-10 m9,10 l9,-10" stroke="#2F855A" stroke-width="4" fill="none"/><path d="M1020,648 l0,-22 m0,0 l-9,-10 m9,10 l9,-10" stroke="#2F855A" stroke-width="4" fill="none"/><text x="1280" y="596" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#2B6CB0" text-anchor="middle" font-weight="bold">Supplemental irrigation</text><text x="1280" y="651" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4A5568" text-anchor="middle" font-weight="normal">less flooding, but critical-period</text><text x="1280" y="678" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4A5568" text-anchor="middle" font-weight="normal">water delivery still needed</text><text x="1190.0" y="754" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#718096" text-anchor="middle" font-weight="normal">deficits are modeled soil-moisture</text><text x="1190.0" y="780" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#718096" text-anchor="middle" font-weight="normal">shortfalls, not observed crop failure</text><text x="1750" y="220" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#B7791F" text-anchor="middle" font-weight="bold">wheat alone</text><rect x="1660" y="240" width="190" height="60" fill="#B7791F" stroke="#4A5568" stroke-width="2"/><text x="1755" y="277" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B4210" text-anchor="middle" font-weight="normal">one crop, one failure mode</text><text x="1750" y="360" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C53030" text-anchor="middle" font-weight="normal">drought / shared shock</text><line x1="1750" y1="380" x2="1750" y2="430" stroke="#C53030" stroke-width="5" marker-end="url(#arr)"/><text x="1750" y="465" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#C53030" text-anchor="middle" font-weight="normal">full exposure</text><text x="2160" y="220" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2F855A" text-anchor="middle" font-weight="bold">wheat + rice</text><rect x="2050" y="240" width="110" height="60" fill="#B7791F" stroke="#4A5568" stroke-width="2"/><rect x="2160" y="240" width="110" height="60" fill="#2F855A" stroke="#4A5568" stroke-width="2"/><text x="2105" y="277" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B4210" text-anchor="middle" font-weight="normal">wheat</text><text x="2215" y="277" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="normal">rice</text><text x="2160" y="360" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2C7A7B" text-anchor="middle" font-weight="normal">same shock → different pathways</text><line x1="2160" y1="380" x2="2160" y2="430" stroke="#2C7A7B" stroke-width="5" marker-end="url(#arr)"/><text x="2160" y="465" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2C7A7B" text-anchor="middle" font-weight="normal">only if joint failure</text><text x="2160" y="488" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2C7A7B" text-anchor="middle" font-weight="normal">dependence is low</text><rect x="1660" y="530" width="620" height="150" rx="10" fill="#EDF7F0" stroke="#2C7A7B" stroke-width="2"/><text x="1970.0" y="568" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2C7A7B" text-anchor="middle" font-weight="bold">modeled severe-shortfall scenarios</text><text x="1970.0" y="602" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1A202C" text-anchor="middle" font-weight="normal">Romania 20.3% → 10.9%</text><text x="1970.0" y="634" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1A202C" text-anchor="middle" font-weight="normal">Kazakhstan 21.2% → 3.0%</text><text x="1970.0" y="662" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#718096" text-anchor="middle" font-weight="normal">scenario outcomes, not observed famine</text><text x="1970.0" y="730" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4A5568" text-anchor="middle" font-weight="normal">non-rice comparators can win:</text><text x="1970.0" y="758" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4A5568" text-anchor="middle" font-weight="normal">Serbia — potato outperforms rice</text><rect x="40" y="845" width="2420" height="120" rx="14" fill="#EDF2F7" stroke="#4A5568" stroke-width="2.5"/><text x="1250" y="893" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#1A202C" text-anchor="middle" font-weight="bold">Feasibility + reliable water delivery + independent failure pathways → conditional resilience.</text><text x="1250" y="931" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#4A5568" text-anchor="middle" font-weight="normal">Potential field trials at selected irrigated sites only. No universal rice-expansion claim. Diversification of crops ≠ diversification of failure modes.</text><rect x="620" y="965" width="26" height="26" rx="5" fill="#2B6CB0"/><text x="660" y="987" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4A5568" text-anchor="start" font-weight="normal">observed evidence</text><rect x="1020" y="965" width="26" height="26" rx="5" fill="#C05621"/><text x="1060" y="987" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4A5568" text-anchor="start" font-weight="normal">modeled estimate</text><rect x="1420" y="965" width="26" height="26" rx="5" fill="#B7791F"/><text x="1460" y="987" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#4A5568" text-anchor="start" font-weight="normal">hypothetical transfer</text></svg>